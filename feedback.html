<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feedback - Segurança Digital</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:15px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#084298;
}

#mensagem{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    color:green;
}

</style>
</head>
<body>

<header>
    <h1>Formulário de Feedback</h1>
    <p>Ajude-nos a melhorar o projeto</p>
</header>

<div class="container">

<form id="feedbackForm">

<label>Nome</label>
<input
type="text"
id="nome"
placeholder="Digite seu nome">

<label>Idade</label>
<input
type="number"
id="idade"
required>

<label>O conteúdo foi útil?</label>
<select id="util" required>
    <option value="">Selecione</option>
    <option value="Sim">Sim</option>
    <option value="Não">Não</option>
</select>

<label>Nota para o conteúdo</label>
<select id="nota" required>
    <option value="">Selecione</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
</select>

<label>Comentário</label>
<textarea
id="comentario"
rows="5"
placeholder="Deixe sua opinião">
</textarea>

<button type="submit">Enviar Feedback</button>

<div id="mensagem"></div>

</form>

</div>

<script type="module" src="js/feedback.js"></script>

</body>
</html>
